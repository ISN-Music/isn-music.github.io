<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savior (Before the Star)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, reverent, a Christmas card that sings
   IDEA: the card itself, opened under a night sky
   PICTURE: the card front, large
   COLOUR and TYPE: night navy, card gold, starlight; Cormorant Garamond
   LAYOUT: one column: card, title, one big play button */
:root{color-scheme:dark;--bg:#0b0b18;--ink:#f3eee2;--gold:#d4af6a;--soft:#a9a6bd}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.5 "Cormorant Garamond",Georgia,serif;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(ellipse 70% 45% at 50% 0%,#1d1d33 0%,var(--bg) 70%);padding:24px 18px 40px}
.card{width:min(420px,86vw);aspect-ratio:900/1260;border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 1px #2a2a40,0 24px 60px -12px #000,0 0 80px -20px rgba(212,175,106,.25)}
.card img{width:100%;height:100%;display:block}
h1{font-weight:600;font-size:clamp(28px,7vw,38px);line-height:1.1;margin:28px 0 22px;text-align:center;color:var(--gold);text-wrap:balance}
.by{color:var(--soft);font-style:italic;margin:0 0 22px;font-size:18px}
.play{width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;background:var(--gold);color:#14141f;
  display:grid;place-items:center;box-shadow:0 8px 30px -6px rgba(212,175,106,.55);transition:transform .15s}
.play:active{transform:scale(.95)}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.play svg{width:34px;height:34px}
.bar{width:min(420px,86vw);margin-top:22px;display:flex;align-items:center;gap:12px;color:var(--soft);font:14px/1 Georgia,serif}
.track{flex:1;height:6px;border-radius:3px;background:#2a2a40;position:relative;cursor:pointer}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:var(--gold)}
.t{min-width:3.2em;font-variant-numeric:tabular-nums}
.t:last-child{text-align:right}
.hint{margin-top:18px;color:var(--soft);font-style:italic;font-size:16px;text-align:center}
.yr{margin-top:auto;padding-top:34px;color:#6f6c86;font-style:italic;font-size:15px}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>
<body>
<div class="card"><img src="card.jpg" alt="Christmas card: a bright star over dark hills. A Savior has been born to you."></div>
<h1>Savior (Before the Star)</h1>
<button class="play" id="play" aria-label="Play">
  <svg id="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
</button>
<div class="bar"><span class="t" id="cur">0:00</span><div class="track" id="track"><div class="fill" id="fill"></div></div><span class="t" id="dur">3:20</span></div>
<p class="hint" id="hint">Tap play to listen</p>
<p class="yr">In the year of our Lord 2026</p>
<audio id="a" src="song.mp3" preload="metadata"></audio>
<script>
{
  const a=document.getElementById('a'),b=document.getElementById('play'),ic=document.getElementById('ic'),
        fill=document.getElementById('fill'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),
        track=document.getElementById('track'),hint=document.getElementById('hint');
  const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
  b.addEventListener('click',()=>{
    if(a.paused){a.play().catch(()=>{hint.textContent='Tap again to play';});}else a.pause();
  });
  a.addEventListener('play',()=>{ic.innerHTML=PAUSE;b.setAttribute('aria-label','Pause');hint.textContent='Merry Christmas';});
  a.addEventListener('pause',()=>{ic.innerHTML=PLAY;b.setAttribute('aria-label','Play');});
  a.addEventListener('loadedmetadata',()=>{dur.textContent=fmt(a.duration);});
  a.addEventListener('timeupdate',()=>{cur.textContent=fmt(a.currentTime);if(a.duration)fill.style.width=(a.currentTime/a.duration*100)+'%';});
  a.addEventListener('ended',()=>{a.currentTime=0;});
  track.addEventListener('click',e=>{if(!a.duration)return;const r=track.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;});
}
</script>
</body>
</html>
